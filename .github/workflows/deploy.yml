name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 손으로 실행할 수도 있게 해둡니다.
  workflow_dispatch:

# GITHUB_TOKEN 에 Pages 배포 권한을 줍니다.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 최신 것만 남깁니다 (진행 중인 건 취소하지 않음).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run build

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 산출물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
